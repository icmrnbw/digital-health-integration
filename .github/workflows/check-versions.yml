name: Check artifact versions

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check CORE-RELEASE markers against needs-core-release issues
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A PR that bumps version: is a prepare-release PR, which no stopgap may outlive.
          ARGS=""
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            if git diff FETCH_HEAD -- sushi-config.yaml | grep -qE '^[+-]version:'; then ARGS=--release; fi
          fi
          python3 .github/scripts/check_core_release_markers.py $ARGS

      - name: Install Sushi
        run: sudo npm install -g fsh-sushi

      - name: Generate resources
        run: sushi .

      - name: Check every artifact version is MAJOR.MINOR.PATCH
        run: python3 .github/scripts/check_artifact_versions.py

      - name: Check supplement versions, supplement links and unused terminology
        run: python3 .github/scripts/check_terminology.py
